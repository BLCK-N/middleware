# Load the repo root .env first so local/dev values are available before datasource creation.
spring.config.import=optional:file:./.env[.properties]

# Active profile
spring.profiles.active=${ENVIRONMENT:default}
active.environment=${ENVIRONMENT}

# -----------------------------
# DataSource Configuration
# -----------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# -----------------------------
# Logging Configuration
# -----------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.myrtle.middleware=${LOG_LEVEL_APP:DEBUG}

# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=MyrtlHikariCP

# Optional Hibernate settings
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# -----------------------------
# JWT Configuration
# -----------------------------
jwt.secret=${JWT_SECRET}
# Opaque refresh tokens. Stored hashed and rotated on each use. Default lifetime is 30 days.
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
# Expired and revoked rows are kept for grace-days so reuse detection and audit still have history.
app.refresh-token.purge.enabled=${REFRESH_TOKEN_PURGE_ENABLED:true}
app.refresh-token.purge.cron=${REFRESH_TOKEN_PURGE_CRON:0 30 3 * * *}
app.refresh-token.purge.zone=Africa/Lagos
app.refresh-token.purge.grace-days=${REFRESH_TOKEN_PURGE_GRACE_DAYS:7}
app.refresh-token.purge.batch-size=${REFRESH_TOKEN_PURGE_BATCH_SIZE:500}
app.refresh-token.purge.max-rows-per-run=${REFRESH_TOKEN_PURGE_MAX_ROWS_PER_RUN:50000}

# -----------------------------
# Field-level encryption
# Encrypts at-rest values that must stay recoverable (corporate onboarding PIN/password).
# Must be a strong random secret; changing it makes existing encrypted rows unreadable.
# -----------------------------
app.encryption.key=${FIELD_ENCRYPTION_KEY}

# -----------------------------
# Sentry Monitoring
# -----------------------------
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${ENVIRONMENT:local}
sentry.release=${APP_VERSION:unknown}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.2}
sentry.send-default-pii=${SENTRY_SEND_DEFAULT_PII:false}

# -----------------------------
# Flutterwave Secret Keys
# -----------------------------
# Set env vars (e.g. FLW_INVEST_MIX, FLW_MONEY_MARKET) or replace with values.
flutterwave.secret-keys.invest-mix=${FLW_INVEST_MIX_SECRET:${FLW_INVEST_MIX:}}
flutterwave.secret-keys.money-market=${FLW_MONEY_MARKET_SECRET:${FLW_MONEY_MARKET:}}
flutterwave.secret-keys.balanced-plus=${FLW_BALANCED_PLUS_SECRET:${FLW_BALANCED_PLUS:}}
flutterwave.secret-keys.dollar-shield=${FLW_DOLLAR_SHIELD_SECRET:${FLW_DOLLAR_SHIELD:}}
flutterwave.webhook-secret=${FLUTTERWAVE_WEBHOOK_SECRET:}
flutterwave.api.base-url=${FLUTTERWAVE_API_BASE_URL}

# -----------------------------
# Flutterwave Public/Encryption Keys
# -----------------------------
flutterwave.public-keys.money-market=${FLW_MONEY_MARKET_PUBLIC}
flutterwave.public-keys.balanced-plus=${FLW_BALANCED_PLUS_PUBLIC}
flutterwave.public-keys.dollar-shield=${FLW_DOLLAR_SHIELD_PUBLIC}

flutterwave.encryption-keys.money-market=${FLW_MONEY_MARKET_ENCRYPTION}
flutterwave.encryption-keys.balanced-plus=${FLW_BALANCED_PLUS_ENCRYPTION}
flutterwave.encryption-keys.dollar-shield=${FLW_DOLLAR_SHIELD_ENCRYPTION}

# -----------------------------
# Actuator / Health Endpoints
# -----------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.roles=ACTUATOR

# -----------------------------
# Myrtle / External URLs
# -----------------------------
app.host=${APP_HOST}
frontend.url=${FRONTEND_URL}

# -----------------------------
# Abandoned / pending onboarding follow-up
# -----------------------------
app.support.email=${SUPPORT_EMAIL:wecare@myrtleng.com}
app.support.phone=${SUPPORT_PHONE:}
app.onboarding.abandonment-threshold=${ONBOARDING_ABANDONMENT_THRESHOLD:24h}
app.onboarding.internal-notify-email=${ONBOARDING_INTERNAL_NOTIFY_EMAIL:wecare@myrtleng.com}
app.onboarding.scheduler.enabled=${ONBOARDING_SCHEDULER_ENABLED:true}
app.onboarding.scheduler.cron=${ONBOARDING_SCHEDULER_CRON:0 0 9 * * *}
app.onboarding.scheduler.zone=Africa/Lagos
app.onboarding.scheduler.batch-size=${ONBOARDING_SCHEDULER_BATCH_SIZE:100}

# -----------------------------
# Amazon SES SMTP (us-east-1)
# -----------------------------
app.ses.region=${APP_SES_REGION:us-east-1}
app.ses.smtp.enabled=${APP_SES_SMTP_ENABLED:true}
app.mail.from=${SES_FROM_EMAIL}
spring.mail.host=${SES_SMTP_HOST:email-smtp.us-east-1.amazonaws.com}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME}
spring.mail.password=${SES_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# -----------------------------
# MyWealth API Configuration
# -----------------------------
mywealth.api.host=${MYWEALTH_API_HOST}
mywealth.tenant.id=${MYWEALTH_TENANT_ID}
mywealth.client.group.id=${MYWEALTH_CLIENT_GROUP_ID}

mywealth.referral.program.id=${MYWEALTH_REFERRAL_PROGRAM_ID:7ab02343-2fb3-43dc-941a-9cbfcb888311}
mywealth.agent.group.id=${MYWEALTH_AGENT_GROUP_ID:01a03ebd-f4b8-79ec-a3a0-142a2f2fbdaf}

mywealth.product.id=${MYWEALTH_PRODUCT_ID}
mywealth.branch.id=${MYWEALTH_BRANCH_ID}
mywealth.daemon.username=${MYWEALTH_DAEMON_USERNAME}
mywealth.daemon.password=${MYWEALTH_DAEMON_PASSWORD}

# -----------------------------
# QoreId API Configuration
# -----------------------------
qoreid.api.host=${QOREID_API_HOST}
qoreid.client.id=${QOREID_CLIENT_ID}
qoreid.secret=${QOREID_SECRET}

# -----------------------------
# Gemini (Octopus MFB) Configuration
# -----------------------------
gemini.api.host=${GEMINI_API_HOST}
gemini.api.key=${GEMINI_API_KEY}

# AWS Settings
cloud.aws.region.static=${CLOUD_AWS_REGION_STATIC}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:${CLOUD_AWS_ACCESS_KEY}}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:${CLOUD_AWS_SECRET_KEY}}
aws.bucket.name=${AWS_BUCKET_NAME}
aws.region=${AWS_REGION}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

openai.api.key=${OPENAI_API_KEY}
